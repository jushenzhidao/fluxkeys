# Dashboard 自动装载配置（生产形态）
#
# 内容与 ../provisioning/dashboards/fluxkeys.yml 相同 —— 独立成文件是为了让
# provisioning.prod 目录自包含（compose 整目录挂载 /etc/grafana/provisioning），
# 生产与本地互不牵连。改这里时必须同步另一份。

apiVersion: 1

providers:
  - name: fluxkeys
    orgId: 1
    folder: FluxKeys
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
