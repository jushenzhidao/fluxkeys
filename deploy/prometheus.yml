# Prometheus 抓取配置 —— 由 docker-compose.yml 只读挂载
#
# 抓取目标是 127.0.0.1:9090：gateway 走 host 网络，与 Prometheus 共享网络栈，
# 网关侧 FLUXKEYS_METRICS_ADDR 默认绑回环，因此这里直连回环即可，
# 不存在「忘了改 target → 全部告警静默失效」的坑。
#
# 改完配置后热加载（无需重启）:
#   curl -X POST http://127.0.0.1:${PROMETHEUS_HOST_PORT:-9091}/-/reload
#
# ⚠️ Prometheus 配置文件读不到 compose 的环境变量，所以 PROMETHEUS_HOST_PORT
#    改用非 9091 时，下面的自抓取目标要手工同步（只影响 Prometheus 自监控，
#    不影响 gateway 指标）。

global:
  # 15s 抓取间隔：配额是秒级变化的状态，但告警判定都带 for 时长，
  # 15s 足够且不会给 gateway 带来可观察的负载。
  scrape_interval: 15s
  scrape_timeout: 10s
  # 规则求值间隔与抓取对齐，避免规则用到尚未刷新的样本
  evaluation_interval: 15s
  external_labels:
    cluster: fluxkeys
    env: prod

rule_files:
  - /etc/prometheus/alerts.yml

# MVP 未部署 Alertmanager，规则仍在 Prometheus UI 的 Alerts 页求值展示，
# 只是不外发通知。接入时取消注释并补 alertmanager 服务。
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  # =========================================================================
  # gateway 业务指标 —— 唯一真正重要的抓取目标
  # =========================================================================
  - job_name: fluxkeys-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          service: gateway

  # =========================================================================
  # Prometheus 自身 —— 确认抓取链路本身是活的
  # 端口须与 compose 里的 --web.listen-address 一致（默认 9091）
  # =========================================================================
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9091"]

# 说明：没有配 redis_exporter / postgres_exporter。
# MVP 阶段 Redis/Postgres 的健康由 compose healthcheck 兜底，
# 配额正确性由 gateway 自己导出的 fluxkeys_* 指标反映（这才是业务真正关心的）。
# 需要 DB 层细节指标时再加 exporter，不在首版铺开。
