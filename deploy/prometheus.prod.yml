# Prometheus 抓取配置 —— 生产形态专用（docker-compose.prod.yml）
#
# 与 deploy/prometheus.yml（本地）的唯一实质差异是 gateway 抓取目标:
#   本地: gateway:9090        （bridge 内服务名 DNS）
#   生产: 127.0.0.1:9090      （gateway 与 Prometheus 同在 host 网络，
#                              网关侧 FLUXKEYS_METRICS_ADDR 已硬编码绑回环）
#
# 用生产文件部署时不存在「忘了改 target → 全部告警静默失效」的坑：
# 这份文件由 compose 直接挂载，改完执行:
#   curl -X POST http://127.0.0.1:${PROMETHEUS_HOST_PORT:-9091}/-/reload

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: fluxkeys
    env: prod

rule_files:
  - /etc/prometheus/alerts.yml

# MVP 未部署 Alertmanager，规则仍在 Prometheus UI 的 Alerts 页求值展示，
# 只是不外发通知。接入时取消注释并补 alertmanager 服务。
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  # =========================================================================
  # gateway 业务指标 —— 唯一真正重要的抓取目标
  # host 网络下与 Prometheus 共享网络栈，直接走回环。
  # =========================================================================
  - job_name: fluxkeys-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          service: gateway

  # =========================================================================
  # Prometheus 自身 —— 确认抓取链路本身是活的
  # =========================================================================
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
