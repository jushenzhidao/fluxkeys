# =============================================================================
# 生产调优档 —— 由 docker-compose.yml 挂载（FLUXKEYS_TUNING=prod，默认）
# =============================================================================
#
# 为什么需要这个文件: compose 形态的配置来源只有「环境变量 + 内置默认值」——
# 而环境变量只映射了 17 个变量（见 internal/config/env.go），下列参数**没有**
# 环境变量出口:
#   redis.pool_size / postgres.max_conns / quota.reap_* / quota.snapshot_interval
#   scheduler.* / egress.request_timeout / server.*
# 也就是说：不挂 YAML，这些参数在容器部署里根本无法调。本文件补上这个出口。
#
# 加载语义（internal/config/load.go）:
#   1. 先取 Default()，再把本文件**叠加**上去 —— 未写到的字段保留默认值，
#      所以这是一个「只写差异」的最小文件，不是全量配置。
#   2. 严格模式：未知字段直接报错（KnownFields）。写错键名不会静默失效，
#      会以启动失败的形式暴露。
#   3. 环境变量优先级高于本文件 —— 所以密钥、EGRESS_IPS、SHARD_ID 这些
#      部署相关项继续留在 .env，不会与本文件冲突。
#   4. **本文件刻意不写 providers 段**：providers 是整体替换（yaml 对 map 逐键
#      合并会让默认的 volc 残留或消失，两种都是坑）。provider 相关改动走
#      VOLC_BASE_URL 环境变量或 /admin/providers 热加载。
#
# 本档的定位：**只补容量，不动风控姿态**。
#   min_request_interval 与 egress_min_interval 都保持默认（5s / 0，即单 Key
#   节流开启、出口节流关闭）。要高吞吐压测请改 FLUXKEYS_TUNING=loadtest，
#   但先读那个文件顶部的代价说明。

# -----------------------------------------------------------------------------
# 连接池 —— 默认值是按「低流量单机」给的，持续 20 QPS 下会先在这里排队
# -----------------------------------------------------------------------------

redis:
  # 每次配额预扣/提交都要占一条连接，且是同步等待。默认 32 在 20 QPS ×
  # 平均 20ms 的配额操作下就会开始排队；上限受 Redis 的 maxclients 约束。
  pool_size: 256

postgres:
  # 流水写入是批量异步的，但看板聚合查询与 Key 装载会与它抢连接。
  # 必须 ≤ Postgres 容器的 max_connections（compose 里设为 100），
  # 且要为 psql 调试、db-backup 留出余量。
  max_conns: 64
  min_conns: 8

# -----------------------------------------------------------------------------
# 配额租约 —— 高 QPS 下租约产生速率高，回收跟不上会「假性占额」
# -----------------------------------------------------------------------------
quota:
  # 约束: reap_interval 必须短于 lease_ttl（Validate 会拦）
  lease_ttl: 120s
  # 流式租约需覆盖长连接场景，保持较长
  stream_lease_ttl: 900s
  # 默认 30s / 500 条：默认值对应的是低流量。按 20 QPS 且 1% 泄漏估算，
  # 每小时约 720 条待回收，500 条/30s 的吞吐是够的，但启动瞬间的
  # 崩溃恢复会一次性堆出上千条，故上调批量。
  reap_interval: 15s
  reap_batch: 2000
  # 调度打分用的只读快照。默认 1s 在 20 QPS 下足够；调到 500ms 让打分
  # 对配额变化的反应更快，代价是每秒多一次全量 Key 扫描。
  snapshot_interval: 500ms

# -----------------------------------------------------------------------------
# 调度器
# -----------------------------------------------------------------------------
scheduler:
  # 活跃池目标大小。默认 100 = 只把最活跃的 100 个 Key 放进调度池。
  # 导入几百上千个 Key 却保持 100，等于人为把吞吐上限钉在
  # 100 ÷ min_request_interval = 20 QPS。这里放到 1000。
  active_pool_size: 1000
  # 档位配比与其 IP 数、max_keys 三者互相锁定（见 config/types.go 的
  # PoolShares 注释）。32 IP 方案（19/5/8）配 70/25/5 时的单 IP 密度约
  # 0.74 / 1.00 / 0.12 req/s，都在风控线内。改 IP 数必须复核这三个数。
  pool_shares:
    hot: 70
    warm: 25
    cold: 5
  pool_fallback: true

# -----------------------------------------------------------------------------
# 上游与出口
# -----------------------------------------------------------------------------
upstream:
  # 单次用户请求内的换 Key 重试次数。3 次意味着最坏情况下游压力放大 4 倍，
  # 在配额普遍充裕的场景里得不偿失；保持默认 3 是因为它对「个别 Key 被封」
  # 的容错价值仍在。
  max_retries: 3
  retry_base_delay: 200ms
  retry_jitter: 500ms

egress:
  # 单次上游请求的整体超时（含流式全程）。仅此一项，mode/ips 由环境变量给。
  request_timeout: 300s

  # 出口地址来源的第二个选项: 扫描本机网卡地址，按下面的分档计划填充。
  #
  # 默认（不写 ips_source）仍是「逐条列地址」——egress.ips 或 EGRESS_IPS。
  # 要用扫描，只需在 .env 里设 EGRESS_IPS_SOURCE=scan（档位计划已在镜像里，
  # 不必重建镜像）；此时 EGRESS_IPS 必须为空，两者同时设置会被配置校验拒绝，
  # 避免「以为生效的那条其实没生效」。
  #
  # ⚠️ 切换前先核对本机实际有几个可用地址（排除回环、docker0/br-*/veth 等）
  #    与下面的计划是否相符: 地址不足会**拒绝启动**，而不是缩水运行 ——
  #    缩水会静默丢掉「出口被封时其上 Key 有地方可去」的撤离余量。
  #
  # 下面的数字来自 deploy/README.md 的分层容量公式（1000 Key 规模，
  # 份额 70/25/5）: 撤离余量 n >= keys/max_keys + 1，故 19×10 / 5×50 / 8×100。
  # 本机地址数不同时按同一公式重算后再改这里。
  # ips_source: scan
  scan:
    tiers:
      - { pool: hot, count: 19, max_keys: 10 }
      - { pool: warm, count: 5, max_keys: 50 }
      # count: 0 表示「接住剩余全部」，只能出现在最后一项。
      # 留它是为了让机器上多出来的地址也被用上（不浪费已付费的出口 IP）。
      - { pool: cold, count: 0, max_keys: 100 }

# -----------------------------------------------------------------------------
# HTTP 服务
# -----------------------------------------------------------------------------
server:
  read_timeout: 60s
  # 保持 0：流式响应可持续数分钟，写超时会在生成中途掐断连接
  write_timeout: 0s
  idle_timeout: 120s
  shutdown_timeout: 30s
  # 10 MiB，够装下带图片的多模态请求体
  max_body_bytes: 10485760
