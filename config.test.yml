# FluxKeys 测试配置 - 商汤 SenseNova
# 用途：真实环境测试，验证多 provider 架构

server:
  addr: "0.0.0.0:8080"

postgres:
  dsn: "host=localhost port=5432 user=fluxkeys password=fluxkeys dbname=fluxkeys sslmode=disable"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

# 多 Provider 配置示例
#
# 平台辨析（实测结论；原始证据文件 real_upstream_test/TEST_REPORT.md 已于 2026-09-13 移除，
# 该上游的现役登记改由 livetest-ai/basics/upstreams.yml 的 id=sensenova 承担）：
# 商汤有两个互不相通
# 的平台，凭据形态与域名必须配套，混用一律 403：
#   - 日日新公测平台  token.sensenova.cn        sk- 形态 Key   ← 用这个
#   - 商汤大装置 AIDC  api.sensenova.cn/compatible-mode  AK|SK 形态
# 旧配置写的 api.sensenova.cn/v1 + SenseChat-5 是上述两个平台的错配。
providers:
  sensenova:
    base_url: "https://token.sensenova.cn"
    quota_kind: "count"
    # 公测期 flash-lite 每 5 小时 1500 次，留余量按 1400 记
    quota_limit: 1400
    quota_window: 5h
    refresh_hour: null  # 滚动窗口，无固定刷新点
    model_mapping:
      "gpt-4": "sensenova-6.8-flash-lite"
      "gpt-4-turbo": "sensenova-6.8-flash-lite"
      "gpt-3.5-turbo": "sensenova-6.7-flash-lite"
      "glm-4": "glm-5.2"
    count_models:
      - "sensenova-6.8-flash-lite"
      - "sensenova-6.7-flash-lite"
      - "glm-5.2"
    reasoning_models: []

default_provider: "sensenova"

# 跨渠道通用配置
upstream:
  max_retries: 3
  retry_base_delay: 500ms
  retry_jitter: 200ms

# 调度器配置
scheduler:
  # 五维权重是 0-100 标度（打分公式为 Weight*Score/100 等），不是 0-1 标度。
  # 写成 0.35 不会报错，只会让权重整体缩水两个数量级、相对比例失真。
  weight_quota: 35
  weight_history: 25
  weight_persona: 20
  weight_health: 15
  soft_penalty: 20
  active_pool_size: 10
  enable_persona: false
  min_request_interval: 5s
  expected_peak_qps: 2.0
  pool_shares: {}  # 单档位，不做分层

# 刷新窗口配置（商汤无固定刷新点，禁用）
refresh:
  enabled: false
  pre_refresh_start: "11:30"
  window_start: "12:00"
  window_end: "14:00"
  probe_interval: 30s
  probe_model: "sensenova-6.8-flash-lite"
  post_refresh_ramp_minutes: 15

# 出口 IP 配置
egress:
  # 配了 ips 就必须显式声明 multi_ip。缺了 mode 会静默回落到默认的 direct，
  # 两个出口都不会被绑定，多出口测试退化成单出口而不报任何错。
  mode: "multi_ip"
  # 目标留空 = 从 provider 的 base_url 推导（token.sensenova.cn:443）。
  # 写死厂商域名会让自检在真实上游拉黑该出口时依然全绿。
  verify_target: ""
  verify_on_start: true
  ban_detect_window: 5m
  ban_cooldown: 1h
  ban_cooldown_max: 24h
  health_check_interval: 1m
  ips:
    - addr: "154.40.45.34"
      public_ip: "154.40.45.34"
      max_keys: 5
      pool: ""
    - addr: "154.40.45.130"
      public_ip: "154.40.45.130"
      max_keys: 5
      pool: ""
